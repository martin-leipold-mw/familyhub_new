spring:
  application:
    name: familyhub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/familyhub}
    username: ${SPRING_DATASOURCE_USERNAME:familyhub}
    password: ${SPRING_DATASOURCE_PASSWORD:familyhub_dev}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8081

familyhub:
  version: ${APP_VERSION:dev}
  security:
    encryption-key: ${FAMILYHUB_ENCRYPTION_KEY:}
  chores:
    # Täglicher Ausgabelauf der Haushaltsaufgaben.
    refill-cron: ${FAMILYHUB_CHORES_REFILL_CRON:0 0 5 * * *}
    refill-zone: ${FAMILYHUB_CHORES_REFILL_ZONE:Europe/Berlin}
    # Obergrenze OFFENER Zuweisungen je Mitglied; erledigte zählen nicht mit.
    max-open-per-member: ${FAMILYHUB_CHORES_MAX_OPEN:5}
