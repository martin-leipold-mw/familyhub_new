openapi: "3.1.0"

info:
  title: FamilyHub API
  version: "0.1.0"
  description: Self-hosted family dashboard — REST API

servers:
  - url: /api
    description: Production (nginx reverse proxy)
  - url: http://localhost:8081/api
    description: Local development

tags:
  - name: System
    description: Health and operational endpoints
  - name: Members
    description: Family member management
  - name: Settings
    description: Setup status and PIN management
  - name: Avatar
    description: Member avatar image (binary)
  - name: GoogleCredentials
    description: Google OAuth credentials management
  - name: GoogleAuth
    description: Google OAuth authorization flow and connection management
  - name: GoogleCalendars
    description: Google Calendar list, selection and manual sync
  - name: Events
    description: Calendar event CRUD
  - name: GoogleTaskLists
    description: Google Tasks list, selection and manual sync
  - name: Tasks
    description: Task CRUD, synced with Google Tasks

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns service status and database connectivity. Always returns 200; `status` field indicates actual health.
      tags: [System]
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/members:
    get:
      operationId: listMembers
      summary: List active family members
      tags: [Members]
      security: []
      responses:
        "200":
          description: Active members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberResponse"
    post:
      operationId: createMember
      summary: Create a family member
      tags: [Members]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequest"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"

  /v1/members/{id}:
    put:
      operationId: updateMember
      summary: Update a family member
      tags: [Members]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
    delete:
      operationId: deleteMember
      summary: Soft-delete a family member
      tags: [Members]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /v1/members/{id}/avatar:
    get:
      operationId: getMemberAvatar
      summary: Get a member avatar JPEG
      tags: [Avatar]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Avatar image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
    put:
      operationId: uploadMemberAvatar
      summary: Upload a member avatar JPEG (already client-compressed)
      tags: [Avatar]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stored

  /v1/settings/setup-status:
    get:
      operationId: getSetupStatus
      summary: Read setup wizard status
      tags: [Settings]
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"

  /v1/settings/setup-step:
    post:
      operationId: updateSetupStep
      summary: Persist the current wizard step (only while setup incomplete)
      tags: [Settings]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupStepRequest"
      responses:
        "204":
          description: Stored

  /v1/settings/set-pin:
    post:
      operationId: setPin
      summary: Set the initial PIN and complete setup
      tags: [Settings]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPinRequest"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"

  /v1/settings/verify-pin:
    post:
      operationId: verifyPin
      summary: Verify the PIN and open a session
      tags: [Settings]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPinRequest"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"

  /v1/settings/change-pin:
    post:
      operationId: changePin
      summary: Change the PIN (requires an active PIN session)
      tags: [Settings]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePinRequest"
      responses:
        "204":
          description: Changed

  /v1/google/credentials:
    get:
      operationId: listCredentials
      summary: List all Google OAuth credentials
      tags: [GoogleCredentials]
      security: []
      responses:
        "200":
          description: List of credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoogleCredentialsResponse"
    post:
      operationId: createCredentials
      summary: Create Google OAuth credentials
      tags: [GoogleCredentials]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredentialsRequest"
      responses:
        "201":
          description: Created credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCredentialsResponse"

  /v1/google/credentials/{id}:
    get:
      operationId: getCredentials
      summary: Get a single Google OAuth credential set
      tags: [GoogleCredentials]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCredentialsResponse"
    put:
      operationId: updateCredentials
      summary: Update Google OAuth credentials
      tags: [GoogleCredentials]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredentialsRequest"
      responses:
        "200":
          description: Updated credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCredentialsResponse"
    delete:
      operationId: deleteCredentials
      summary: Delete Google OAuth credentials
      tags: [GoogleCredentials]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /v1/google/credentials/{id}/primary:
    put:
      operationId: setPrimaryCredentials
      summary: Set credentials as primary
      tags: [GoogleCredentials]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCredentialsResponse"

  /v1/google/credentials/validate:
    post:
      operationId: validateCredentials
      summary: Validate Google OAuth credentials against the token endpoint
      tags: [GoogleCredentials]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsValidationRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsValidationResponse"

  /v1/google/auth/authorize:
    get:
      operationId: authorizeGoogle
      summary: Start Google OAuth authorization flow
      tags: [GoogleAuth]
      security: []
      parameters:
        - name: credentialsId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: returnUrl
          in: query
          required: false
          schema:
            type: string
        - name: memberId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorization URL to redirect the user to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUrlResponse"

  /v1/google/auth/callback:
    post:
      operationId: googleCallback
      summary: Handle Google OAuth callback
      tags: [GoogleAuth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCallbackRequest"
      responses:
        "200":
          description: Callback handled, member info returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCallbackResponse"

  /v1/google/connections:
    get:
      operationId: listConnections
      summary: List all Google account connections
      tags: [GoogleAuth]
      security: []
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionResponse"

  /v1/google/connections/{id}/disconnect:
    post:
      operationId: disconnectConnection
      summary: Disconnect a Google account connection
      tags: [GoogleAuth]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Disconnected

  /v1/google/connections/{id}/refresh:
    post:
      operationId: refreshConnection
      summary: Force-refresh the access token for a Google account connection
      tags: [GoogleAuth]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Token refreshed

  /v1/google/calendars:
    get:
      operationId: listGoogleCalendars
      summary: List Google calendars for a family member
      tags: [GoogleCalendars]
      security: []
      parameters:
        - name: memberId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of calendars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarResponse"

  /v1/google/calendars/selected:
    put:
      operationId: saveSelectedCalendars
      summary: Save which calendars are selected for sync
      tags: [GoogleCalendars]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectedCalendarsRequest"
      responses:
        "200":
          description: Selection saved

  /v1/google/calendars/sync:
    post:
      operationId: syncCalendars
      summary: Manually trigger a calendar sync for a family member
      tags: [GoogleCalendars]
      security: []
      parameters:
        - name: memberId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResultResponse"

  /v1/google/calendars/all:
    get:
      operationId: listAllCalendars
      summary: List calendars across all connected accounts with resolved colors
      tags: [GoogleCalendars]
      security: []
      responses:
        "200":
          description: All calendars across all connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarResponse"

  /v1/google/calendars/flags:
    put:
      operationId: updateCalendarFlags
      summary: Set shared / write-target flags on a calendar (PIN-protected)
      tags: [GoogleCalendars]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarFlagsRequest"
      responses:
        "200":
          description: Flags updated

  /v1/events:
    get:
      operationId: listEvents
      summary: List calendar events
      tags: [Events]
      security: []
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: string
        - name: end
          in: query
          required: false
          schema:
            type: string
        - name: memberId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: calendarId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventResponse"
    post:
      operationId: createEvent
      summary: Create a calendar event
      tags: [Events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreateRequest"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"

  /v1/events/{id}:
    get:
      operationId: getEvent
      summary: Get a single calendar event
      tags: [Events]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
    put:
      operationId: updateEvent
      summary: Update a calendar event
      tags: [Events]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [instance, series]
            default: instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreateRequest"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
    delete:
      operationId: deleteEvent
      summary: Delete a calendar event
      tags: [Events]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [instance, series]
            default: instance
      responses:
        "204":
          description: Deleted

  /v1/events/{id}/series:
    get:
      operationId: getEventSeries
      summary: Get the parent series (with recurrence rule) of a recurring event instance
      tags: [Events]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Parent series event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"

  /v1/google/task-lists:
    get:
      operationId: listTaskLists
      summary: List Google task lists, optionally filtered by family member
      tags: [GoogleTaskLists]
      security: []
      parameters:
        - name: memberId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of task lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskListResponse"

  /v1/google/task-lists/selected:
    put:
      operationId: saveSelectedTaskLists
      summary: Save which task lists are selected for sync (PIN-protected)
      tags: [GoogleTaskLists]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectedTaskListsRequest"
      responses:
        "200":
          description: Selection saved

  /v1/google/task-lists/sync:
    post:
      operationId: syncTaskLists
      summary: Manually trigger a task sync for a family member
      tags: [GoogleTaskLists]
      security: []
      parameters:
        - name: memberId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResultResponse"

  /v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks; completed tasks are limited to the last 30 days
      tags: [Tasks]
      security: []
      parameters:
        - name: memberId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"
    post:
      operationId: createTask
      summary: Create a task and push it to Google Tasks
      tags: [Tasks]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /v1/tasks/{id}:
    patch:
      operationId: updateTask
      summary: Partially update a task and push the change to Google Tasks
      tags: [Tasks]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
    delete:
      operationId: deleteTask
      summary: Delete a task at Google and locally
      tags: [Tasks]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Task deleted

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp, version]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          example: UP
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp of the check
          example: "2026-07-21T10:00:00Z"
        version:
          type: string
          description: Build version (Git SHA from CI)
          example: "abc1234"

    ErrorResponse:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Ungültige Anfrage
        correlationId:
          type: string
          format: uuid

    MemberRequest:
      type: object
      required: [name, role, color]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Anna
        role:
          type: string
          pattern: "^(parent|child)$"
          example: parent
        color:
          type: string
          pattern: "^(blue|pink|green|purple|orange|teal)$"
          example: blue
        dateOfBirth:
          type: string
          format: date
          example: "2015-04-01"

    MemberResponse:
      type: object
      required: [id, name, role, color, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        color:
          type: string
        dateOfBirth:
          type: string
          format: date
        isActive:
          type: boolean
        avatarUrl:
          type: string
          description: Present when an avatar exists, else null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SetupStatusResponse:
      type: object
      required: [setupCompleted, currentStep, hasFamilyMembers, hasPin, hasCredentials, hasConnection, hasSelectedCalendars]
      properties:
        setupCompleted:
          type: boolean
        currentStep:
          type: integer
          format: int32
        hasFamilyMembers:
          type: boolean
        hasPin:
          type: boolean
        hasCredentials:
          type: boolean
        hasConnection:
          type: boolean
        hasSelectedCalendars:
          type: boolean

    SetupStepRequest:
      type: object
      required: [step]
      properties:
        step:
          type: integer
          format: int32
          minimum: 1
          maximum: 7

    SetPinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
          example: "1234"

    VerifyPinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          example: "1234"

    ChangePinRequest:
      type: object
      required: [currentPin, newPin]
      properties:
        currentPin:
          type: string
          example: "1234"
        newPin:
          type: string
          pattern: "^[0-9]{4,6}$"
          example: "5678"

    SessionTokenResponse:
      type: object
      required: [sessionToken]
      properties:
        sessionToken:
          type: string
          format: uuid

    GoogleCredentialsRequest:
      type: object
      required: [nickname, redirectUri]
      properties:
        nickname:
          type: string
          example: "Meine Google-App"
        clientId:
          type: string
          nullable: true
          example: "123456789-abc.apps.googleusercontent.com"
        clientSecret:
          type: string
          nullable: true
          example: "GOCSPX-secret"
        redirectUri:
          type: string
          example: "https://familyhub.local/api/v1/google/oauth/callback"

    GoogleCredentialsResponse:
      type: object
      required: [id, nickname, redirectUri, isPrimary, isActive]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        redirectUri:
          type: string
        isPrimary:
          type: boolean
        isActive:
          type: boolean

    CredentialsValidationRequest:
      type: object
      required: [clientId, clientSecret, redirectUri]
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
        redirectUri:
          type: string

    CredentialsValidationResponse:
      type: object
      required: [isValid, message]
      properties:
        isValid:
          type: boolean
        message:
          type: string

    AuthUrlResponse:
      type: object
      required: [authUrl]
      properties:
        authUrl:
          type: string
          description: Google OAuth authorization URL to redirect the user to

    OAuthCallbackRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
          description: Authorization code from Google
        state:
          type: string
          description: State nonce from the authorization request

    OAuthCallbackResponse:
      type: object
      required: [memberId, memberName, isNewMember, returnUrl]
      properties:
        memberId:
          type: string
          format: uuid
        memberName:
          type: string
        isNewMember:
          type: boolean
        returnUrl:
          type: string

    ConnectionResponse:
      type: object
      required: [connectionId, memberId, email, name, status, scopes]
      properties:
        connectionId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        status:
          type: string
        lastSyncedAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of last sync, null if never synced
        scopes:
