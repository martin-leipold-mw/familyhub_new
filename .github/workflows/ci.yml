name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/familyhub-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/familyhub-frontend

jobs:
  validate-spec:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install openapi-generator-cli
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Validate openapi.yml
        run: openapi-generator-cli validate -i api/openapi.yml

  openapi-breaking:
    name: OpenAPI — Breaking Changes
    runs-on: ubuntu-latest
    needs: validate-spec
    # Only on PRs, and skippable for intentional breaks via a 'breaking-change' label.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'breaking-change')
    steps:
      - uses: actions/checkout@v4

      - name: Extract base spec from target branch
        id: base
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git show "FETCH_HEAD:api/openapi.yml" > /tmp/openapi-base.yml 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No api/openapi.yml on ${{ github.base_ref }} yet — skipping breaking-change check."
          fi

      - name: Fail on breaking API changes
        if: steps.base.outputs.exists == 'true'
        run: |
          docker run --rm -v /tmp:/tmp -v "$PWD/api:/api" tufin/oasdiff:latest \
            breaking /tmp/openapi-base.yml /api/openapi.yml --fail-on ERR

  build-backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    needs: validate-spec
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Run tests and verify coverage
        run: cd backend && ./gradlew check
        env:
          SPRING_DATASOURCE_URL: ''  # Testcontainers handles this

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}

  build-frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    needs: validate-spec
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Generate API client
        run: cd frontend && npm run generate:api

      - name: Check (type-check + lint + test coverage)
        run: cd frontend && npm run check

      - name: Build
        run: cd frontend && npm run build

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  e2e:
    name: Frontend — Playwright E2E
    runs-on: ubuntu-latest
    needs: validate-spec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Generate API client
        run: cd frontend && npm run generate:api

      - name: Run Playwright E2E tests
        run: cd frontend && npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
