services:
  postgres:
    image: postgres:16-alpine
    container_name: familyhub-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - familyhub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_USER}/familyhub-backend:latest
    container_name: familyhub-backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FAMILYHUB_ENCRYPTION_KEY: ${FAMILYHUB_ENCRYPTION_KEY}
      APP_VERSION: ${APP_VERSION:-unknown}
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - familyhub-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    image: ghcr.io/${GITHUB_USER}/familyhub-frontend:latest
    container_name: familyhub-frontend
    ports:
      - "3080:80"
    environment:
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - familyhub-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  watchtower:
    image: containrrr/watchtower:latest
    container_name: familyhub-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
    command: familyhub-backend familyhub-frontend
    restart: unless-stopped

volumes:
  postgres_data:
    # Fixed name instead of "<directory>_postgres_data", so the stack never picks up
    # the volume of an older installation that lives in a directory of the same name.
    name: familyhub-new-postgres-data

networks:
  familyhub-network:
    driver: bridge
